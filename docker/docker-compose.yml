# Production-like stack. Run from the repository root:
#   docker compose -f docker/docker-compose.yml up --build -d

x-backend-build: &backend-build
  context: ..
  dockerfile: docker/Dockerfile.backend
  target: runtime

x-backend-env: &backend-env
  POSTGRES_HOST: db
  REDIS_URL: redis://redis:6379/0

services:

  db:
    image: postgres:17-alpine
    container_name: apan-db
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [apan-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: apan-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    networks: [apan-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs pending migrations once, before the API starts.
  migrate:
    build: *backend-build
    image: apan-backend:latest
    container_name: apan-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: ../.env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    networks: [apan-network]
    restart: "no"

  backend:
    build: *backend-build
    image: apan-backend:latest
    container_name: apan-backend
    restart: unless-stopped
    env_file: ../.env
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [apan-network]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: apan-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [apan-network]

volumes:
  pgdata:
  redisdata:

networks:
  apan-network:
    driver: bridge
